<section class="event-slider-section">
  <div class="container-lg" style="max-width: 1200px; margin: 0 auto;">
    <h2 class="section-title">Najpopularniejsze Eventy</h2>

    <!-- Loading State -->
    <div class="loading-container" *ngIf="isLoading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Ładowanie...</span>
      </div>
    </div>

    <!-- Slider -->
    <div class="slider-container" *ngIf="!isLoading && popularEvents.length > 0">
      <button class="slider-btn slider-btn-prev" (click)="prevSlide()" [disabled]="currentSlide === 0">
        <i class="bi bi-chevron-left"></i>
      </button>

      <div class="slider-wrapper">
        <div class="slider-track" [ngStyle]="{ transform: getTransform() }">
          <div class="slider-item" *ngFor="let event of popularEvents">
            <app-event-card
              [event]="event"
              (cardClick)="goToEvent($event)"
            ></app-event-card>
          </div>
        </div>
      </div>

      <button class="slider-btn slider-btn-next" (click)="nextSlide()" [disabled]="currentSlide >= popularEvents.length - slidesToShow">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!isLoading && popularEvents.length === 0">
      <p>Brak dostępnych eventów</p>
    </div>
  </div>
</section>
