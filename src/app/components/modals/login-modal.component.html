<div class="modal-backdrop" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="modal-dialog">
    <div class="modal-content">
      <button type="button" class="btn-close" (click)="closeModal()"></button>

      <!-- Login Mode -->
      <div class="modal-body" *ngIf="isLoginMode">
        <h2 class="modal-title">Sign In</h2>
        <p class="modal-subtitle">Welcome back to EventHub!</p>

        <!-- Error Message -->
        <div class="alert alert-danger" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <!-- Success Message -->
        <div class="alert alert-success" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              class="form-control"
              formControlName="email"
              placeholder="twój@email.com"
              [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              formControlName="password"
              placeholder="••••••••"
              [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="loginForm.invalid || isLoading"
          >
            <span *ngIf="!isLoading">Sign In</span>
            <span *ngIf="isLoading">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Signing In...
            </span>
          </button>
        </form>

        <!-- Toggle to Register -->
        <p class="modal-toggle">
          Don't have an account?
          <a (click)="toggleMode()" class="toggle-link">Sign Up</a>
        </p>
      </div>

      <!-- Register Mode -->
      <div class="modal-body" *ngIf="!isLoginMode">
        <h2 class="modal-title">Sign Up</h2>
        <p class="modal-subtitle">Join EventHub!</p>

        <!-- Error Message -->
        <div class="alert alert-danger" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <!-- Success Message -->
        <div class="alert alert-success" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <!-- Register Form -->
        <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              class="form-control"
              formControlName="name"
              placeholder="John Doe"
              [class.is-invalid]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched"
            />
          </div>

          <div class="form-group">
            <label for="register-email">Email</label>
            <input
              type="email"
              id="register-email"
              class="form-control"
              formControlName="email"
              placeholder="your@email.com"
              [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
            />
          </div>

          <div class="form-group">
            <label for="register-password">Password</label>
            <input
              type="password"
              id="register-password"
              class="form-control"
              formControlName="password"
              placeholder="••••••••"
              [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
            />
          </div>

          <div class="form-group">
            <label for="register-password-confirm">Confirm Password</label>
            <input
              type="password"
              id="register-password-confirm"
              class="form-control"
              formControlName="passwordConfirmation"
              placeholder="••••••••"
              [class.is-invalid]="registerForm.get('passwordConfirmation')?.invalid && registerForm.get('passwordConfirmation')?.touched"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary w-100"
            [disabled]="registerForm.invalid || isLoading"
          >
            <span *ngIf="!isLoading">Sign Up</span>
            <span *ngIf="isLoading">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Registering...
            </span>
          </button>
        </form>

        <!-- Toggle to Login -->
        <p class="modal-toggle">
          Already have an account?
          <a (click)="toggleMode()" class="toggle-link">Sign In</a>
        </p>
      </div>
    </div>
  </div>
</div>
