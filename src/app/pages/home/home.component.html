<div class="home-page">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">Odkryj najlepsze wydarzenia w Twojej okolicy</h1>
      <p class="hero-subtitle">Znajdź konerty, festiwale, konferencje i wiele więcej</p>
    </div>
  </section>

  <!-- Event Slider -->
  <app-event-slider></app-event-slider>

  <!-- Upcoming Events Section -->
  <section class="events-section">
    <div class="container-lg" style="max-width: 1200px; margin: 0 auto;">
      <div class="section-header">
        <h2 class="section-title">Nadchodzące Wydarzenia</h2>
        <p class="section-subtitle">Zaplanuj swoją przyszłość z nami</p>
      </div>

      <!-- Loading State -->
      <div class="loading-container" *ngIf="isLoading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Ładowanie...</span>
        </div>
      </div>

      <!-- Events Grid -->
      <div class="events-grid" *ngIf="!isLoading && events.length > 0">
        <div class="event-item" *ngFor="let event of events">
          <app-event-card
            [event]="event"
            (cardClick)="goToEventDetail($event)"
            (favoriteToggle)="onFavoriteToggle($event)"
          ></app-event-card>
        </div>
      </div>

      <!-- Empty State -->
      <div class="empty-state" *ngIf="!isLoading && events.length === 0">
        <i class="bi bi-calendar-x"></i>
        <h3>Brak dostępnych eventów</h3>
        <p>Wrócić wkrótce</p>
      </div>

      <!-- Pagination -->
      <nav class="pagination-container" *ngIf="!isLoading && totalPages > 1">
        <ul class="pagination">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" (click)="onPageChange(1)">
              <i class="bi bi-chevron-double-left"></i>
            </button>
          </li>
          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" (click)="onPageChange(currentPage - 1)">
              <i class="bi bi-chevron-left"></i>
            </button>
          </li>

          <li class="page-item" *ngFor="let page of pageNumbers" [class.active]="page === currentPage">
            <button class="page-link" (click)="onPageChange(page)">
              {{ page }}
            </button>
          </li>

          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <button class="page-link" (click)="onPageChange(currentPage + 1)">
              <i class="bi bi-chevron-right"></i>
            </button>
          </li>
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <button class="page-link" (click)="onPageChange(totalPages)">
              <i class="bi bi-chevron-double-right"></i>
            </button>
          </li>
        </ul>
        <div class="pagination-info">
          Strona {{ currentPage }} z {{ totalPages }}
        </div>
      </nav>
    </div>
  </section>

  <!-- Login Modal -->
  <app-login-modal [isOpen]="showLoginModal" (close)="closeLoginModal()"></app-login-modal>
</div>
