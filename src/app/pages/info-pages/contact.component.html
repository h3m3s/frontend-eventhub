<div class="info-page">
  <div class="container-fluid py-5">
    <div class="row">
      <div class="col-lg-6">
        <h1>Kontakt</h1>
        <p>Mamy pytania? Chętnie Ci pomagamy!</p>

        <div class="contact-info">
          <div class="info-item">
            <i class="bi bi-envelope"></i>
            <div>
              <h5>Email</h5>
              <p><a href="mailto:info@eventhub.pl">info@eventhub.pl</a></p>
            </div>
          </div>

          <div class="info-item">
            <i class="bi bi-telephone"></i>
            <div>
              <h5>Telefon</h5>
              <p><a href="tel:+48123456789">+48 123 456 789</a></p>
            </div>
          </div>

          <div class="info-item">
            <i class="bi bi-geo-alt"></i>
            <div>
              <h5>Adres</h5>
              <p>ul. Eventowa 1<br>00-000 Warszawa</p>
            </div>
          </div>

          <div class="info-item">
            <i class="bi bi-clock"></i>
            <div>
              <h5>Godziny Pracy</h5>
              <p>Pn-Pt: 09:00 - 18:00<br>Sb-Nd: Zamknięte</p>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="contact-form-card">
          <h3>Wyślij Wiadomość</h3>
          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label>Imię i Nazwisko</label>
              <input
                type="text"
                class="form-control"
                formControlName="name"
                placeholder="Twoje imię"
              />
            </div>

            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                class="form-control"
                formControlName="email"
                placeholder="Twój email"
              />
            </div>

            <div class="form-group">
              <label>Temat</label>
              <input
                type="text"
                class="form-control"
                formControlName="subject"
                placeholder="Temat wiadomości"
              />
            </div>

            <div class="form-group">
              <label>Wiadomość</label>
              <textarea
                class="form-control"
                formControlName="message"
                rows="5"
                placeholder="Twoja wiadomość..."
              ></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="contactForm.invalid || isSending">
              {{ isSending ? 'Wysyłanie...' : 'Wyślij Wiadomość' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
