<div class="info-page">
  <div class="container-fluid py-5">
    <div class="row">
      <div class="col-lg-6">
        <h1>Contact</h1>
        <p>Have questions? We're happy to help!</p>

        <div class="contact-info">
          <div class="info-item">
            <i class="bi bi-envelope"></i>
            <div>
              <h5>Email</h5>
              <p><a href="mailto:info@eventhub.pl">info@eventhub.pl</a></p>
            </div>
          </div>

          <div class="info-item">
            <i class="bi bi-telephone"></i>
            <div>
              <h5>Telefon</h5>
              <p><a href="tel:+48123456789">+48 123 456 789</a></p>
            </div>
          </div>

          <div class="info-item">
            <i class="bi bi-geo-alt"></i>
            <div>
              <h5>Address</h5>
              <p>Eventowa Street 1<br>00-000 Warsaw</p>
            </div>
          </div>

          <div class="info-item">
            <i class="bi bi-clock"></i>
            <div>
              <h5>Business Hours</h5>
              <p>Mon-Fri: 09:00 - 18:00<br>Sat-Sun: Closed</p>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="contact-form-card">
          <h3>Send Message</h3>
          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label>Full Name</label>
              <input
                type="text"
                class="form-control"
                formControlName="name"
                placeholder="Your name"
              />
            </div>

            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                class="form-control"
                formControlName="email"
                placeholder="Twój email"
              />
            </div>

            <div class="form-group">
              <label>Subject</label>
              <input
                type="text"
                class="form-control"
                formControlName="subject"
                placeholder="Message subject"
              />
            </div>

            <div class="form-group">
              <label>Message</label>
              <textarea
                class="form-control"
                formControlName="message"
                rows="5"
                placeholder="Your message..."
              ></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="contactForm.invalid || isSending">
              {{ isSending ? 'Sending...' : 'Send Message' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
